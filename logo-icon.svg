<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" shape-rendering="geometricPrecision">
  <defs>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff88"/>
      <stop offset="100%" stop-color="#00c853"/>
    </linearGradient>
    <filter id="iconGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Quadrado escuro -->
  <rect x="6" y="6" width="108" height="108" rx="22" fill="#0a0a0f" stroke="#14181c" stroke-width="2"/>
  <rect x="6" y="6" width="108" height="108" rx="22" fill="none" stroke="url(#iconGrad)" stroke-width="3" opacity="0.9" filter="url(#iconGlow)"/>

  <!-- Círculo verde -->
  <circle cx="60" cy="60" r="28" fill="url(#iconGrad)" filter="url(#iconGlow)"/>

  <!-- Ponteiros brancos -->
  <g fill="#ffffff" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <line x1="60" y1="38" x2="60" y2="58"/>
    <line x1="60" y1="58" x2="78" y2="44"/>
  </g>
</svg>
